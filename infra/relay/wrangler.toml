# Kaeru relay — forwards encrypted frames between exactly two peers in a room.
# Deploy: npx wrangler login && npx wrangler deploy   (see README.md)

name = "kaeru-relay"
main = "src/index.ts"
# Pinned to the newest date the vitest pool's bundled workerd accepts, so tests and
# production run the same runtime semantics.
compatibility_date = "2026-08-22"
# `web_socket_auto_reply_to_close` — the runtime answering a peer's Close frame by itself — is
# on by this date (default since 2026-04-07), and workerd refuses a config that names a flag
# its date already implies. `RoomDO.webSocketClose` replies explicitly all the same.

# Workers Logs, so `npx wrangler tail` and the dashboard show the relay's events.
[observability]
enabled = true

# The app's Shikimori client id. Public by design — it travels in every authorization URL a
# viewer's browser opens — and it is here so /oauth/token can refuse a request from anything but
# this app. Its companion, SHIKIMORI_CLIENT_SECRET, is never in this file: it is set once with
#   npx wrangler secret put SHIKIMORI_CLIENT_SECRET
# and lives only in Cloudflare's store from then on.
[vars]
SHIKIMORI_CLIENT_ID = "_MQPkUPZ7AUhCQBBnQhdipfXDTQpBmT5JtpRByuFXeg"

# One Durable Object per room, addressed by idFromName(roomId).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# One per client address, addressed by idFromName(ip): the token route's rate limit.
[[durable_objects.bindings]]
name = "RATE"
class_name = "RateDO"

# SQLite-backed Durable Objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateDO"]

# A custom domain is not configured yet; the default workers.dev URL is used first.
# To move the relay to relay.kaeru.vitaliy.velikodniy.name later, add the zone to
# Cloudflare and uncomment:
#
# [[routes]]
# pattern = "relay.kaeru.vitaliy.velikodniy.name"
# custom_domain = true
